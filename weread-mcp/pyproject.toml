[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "weread-mcp"
version = "1.0.0"
description = "Standalone Model Context Protocol server for WeRead (微信读书)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2,<2",
  "httpx>=0.28,<1",
  "qrcode[pil]>=8,<10",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["weread_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Windows 下系统临时目录（pytest-of-<user>）可能被 ACL 拒绝，改用项目内临时目录。
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
