spring:
  application:
    name: adaptive-learning
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/adaptive_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:learning}
    password: ${DB_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 205MB
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deletedAt
      logic-delete-value: now()
      logic-not-delete-value: 'null'

app:
  model-secret:
    encryption-key: ${MODEL_SECRET_ENCRYPTION_KEY:${JWT_SECRET:}}
  ai-service:
    enabled: ${AI_SERVICE_ENABLED:false}
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8090}
    internal-token: ${AI_INTERNAL_TOKEN:local-ai-internal-token-change-me-32}
    timeout: ${AI_SERVICE_TIMEOUT:PT330S}
    model-name: ${MODEL_NAME:}
  ai:
    enabled: ${MODEL_ENABLED:true}
    base-url: ${MODEL_BASE_URL:}
    api-key: ${MODEL_API_KEY:}
    model: ${MODEL_NAME:}
    timeout: ${MODEL_TIMEOUT:PT45S}
    max-output-tokens: ${MODEL_MAX_OUTPUT_TOKENS:1200}
    thinking: ${MODEL_THINKING:disabled}
  redis:
    enabled: ${REDIS_ENABLED:true}
  rate-limit:
    login:
      max-requests: ${LOGIN_RATE_LIMIT:20}
      window: ${LOGIN_RATE_WINDOW:PT1M}
    verification:
      max-requests: ${VERIFICATION_RATE_LIMIT:5}
      window: ${VERIFICATION_RATE_WINDOW:PT10M}
    model:
      max-requests: ${MODEL_RATE_LIMIT:20}
      window: ${MODEL_RATE_WINDOW:PT1M}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    auth-enabled: ${MAIL_AUTH_ENABLED:true}
    starttls-enabled: ${MAIL_STARTTLS_ENABLED:true}
    ssl-enabled: ${MAIL_SSL_ENABLED:false}
    connection-timeout: ${MAIL_CONNECTION_TIMEOUT:PT10S}
    write-timeout: ${MAIL_WRITE_TIMEOUT:PT10S}
    read-timeout: ${MAIL_READ_TIMEOUT:PT10S}
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-before-production-123456}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    login-max-failures: 5
    login-lock-minutes: 15
    verification-code-minutes: ${VERIFICATION_CODE_MINUTES:10}
    verification-code-resend-seconds: ${VERIFICATION_CODE_RESEND_SECONDS:60}
    verification-code-max-attempts: ${VERIFICATION_CODE_MAX_ATTEMPTS:5}
    verification-code-pepper: ${VERIFICATION_CODE_PEPPER:${JWT_SECRET:local-development-secret-change-before-production-123456}}
  planning:
    confirmation-minutes: 30
    high-impact-task-threshold: 3
    impact-window-days: 14
    max-task-minutes: 120
    auto-optimization-cooldown: ${AUTO_OPTIMIZATION_COOLDOWN:PT24H}
  outbox:
    poll-delay: ${OUTBOX_POLL_DELAY:PT5S}
  storage:
    root: ${STORAGE_ROOT:./data/objects}
    clamav-host: ${CLAMAV_HOST:}
    clamav-port: ${CLAMAV_PORT:3310}
    antivirus-required: ${ANTIVIRUS_REQUIRED:false}
  rag:
    chunk-target-chars: 600
    chunk-max-chars: 1600
    top-k: 5
    python-fallback-enabled: ${AI_SERVICE_RAG_FALLBACK:true}
  task-chat:
    history-max-messages: ${TASK_CHAT_HISTORY_MAX_MESSAGES:400}
    history-max-characters: ${TASK_CHAT_HISTORY_MAX_CHARACTERS:600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5300,http://127.0.0.1:5300}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
