spring:
  datasource:
    url: jdbc:h2:mem:learning-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
  data:
    redis:
      repositories:
        enabled: false
app:
  redis:
    enabled: false
  scheduling:
    enabled: false
  storage:
    root: ./target/test-objects
  security:
    jwt-secret: test-secret-with-at-least-thirty-two-characters-123
    verification-code-store: memory
